name: Desplegar Front-end en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Generar build de Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      - name: Configurar fallback para SPA
        run: cp ./dist/front-end/browser/index.html ./dist/front-end/browser/404.html
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/front-end/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
